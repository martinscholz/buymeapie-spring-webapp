spring:
  application:
    name: buymeapie-webapp
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./data}/buymeapie;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cache:
    type: simple
    cache-names: account,restrictions,lists,listDetails,listItems,uniqueItems

buymeapie:
  base-url: ${BUYMEAPIE_BASE_URL:https://api.buymeapie.com}
  username: ${BUYMEAPIE_USERNAME:}
  pin: ${BUYMEAPIE_PIN:}
  timeout: ${BUYMEAPIE_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
